name: pastry_shop
description: A Flutter mobile application for a bakery and cafe shop management system.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management - Riverpod (recommended for scalability)
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0

  # Networking
  dio: ^5.3.0
  retrofit: ^4.0.0
  
  # Routing & Navigation
  go_router: ^13.0.0

  # Storage - Secure and Local
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.0

  # JSON Serialization
  json_serializable: ^6.7.0
  json_annotation: ^4.8.0

  # UI/UX Components
  flutter_svg: ^2.0.0
  shimmer: ^3.0.0
  lottie: ^2.4.0

  # Utilities
  logger: ^2.0.0
  intl: ^0.19.0
  
  # Google Sign-In (if needed)
  google_sign_in: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.0
  riverpod_generator: ^2.3.0
  retrofit_generator: ^7.0.0

  # Linting & Analysis
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

name: Deploy pastry project to Hostinger

on:
  push:
    branches:
      - main
    paths:
      - "customer_portal/**"
      - "laravel/**"
      - "customer/**"
      - "includes/**"
      - "customer/api_register.php"
      - "customer/api_place_order.php"
      - "includes/api_auth.php"
      - "includes/db.php"
      - "includes/inventory.php"
      - "admin/api/api_predictive_analytics.php"
      - "staff/api_business_analytics.php"
      - "staff/api_orders.php"
      - "staff/api_product_stock_history.php"
      - "staff/api_update_order_status.php"
      - "staff/.htaccess"
      - "staff/api_waste_log.php"
      - "uploads/about us.jpg"
      - "uploads/login_cake.png"
      - "uploads/**"
      - ".htaccess"
      - ".github/workflows/deploy-hostinger.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
      SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
      SSH_USERNAME: ${{ secrets.HOSTINGER_SSH_USERNAME }}
      SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
      REMOTE_ROOT: domains/pastryproject.shop/public_html

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify deployment scope
        id: deployment_scope
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -eu
          if [ "${{ github.event_name }}" != "push" ] || [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "frontend_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          frontend_only=true
          ui_files=0
          while IFS= read -r changed_file; do
            case "$changed_file" in
              customer_portal/src/admin/operations/pages/Orders.jsx|customer_portal/src/admin/operations/pages/Orders.test.jsx|customer_portal/src/admin/operations/pages/OrderHistory.jsx|customer_portal/src/admin/operations/pages/CustomCakes.jsx|customer_portal/src/admin/operations/pages/Ingredients.jsx|customer_portal/src/admin/operations/pages/operationsPages.css)
                ui_files=$((ui_files + 1))
                ;;
              .github/workflows/deploy-hostinger.yml)
                ;;
              *)
                frontend_only=false
                ;;
            esac
          done <<EOF
          $(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")
          EOF

          echo "frontend_only=$frontend_only" >> "$GITHUB_OUTPUT"
          echo "Frontend-only deployment: $frontend_only"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: customer_portal/package-lock.json

      - name: Install dependencies
        working-directory: customer_portal
        run: npm ci

      - name: Build customer portal
        working-directory: customer_portal
        env:
          CI: "false"
          REACT_APP_RECAPTCHA_SITE_KEY: ${{ secrets.REACT_APP_RECAPTCHA_SITE_KEY }}
        run: |
          if [ -z "$REACT_APP_RECAPTCHA_SITE_KEY" ]; then
            echo "::error::Missing REACT_APP_RECAPTCHA_SITE_KEY repository secret."
            exit 1
          fi
          npm run build

      - name: Set up PHP for Laravel dependencies
        if: steps.deployment_scope.outputs.frontend_only != 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, ctype, curl, fileinfo, json, mbstring, openssl, pdo_mysql, tokenizer, xml
          tools: composer:v2
          coverage: none

      - name: Install Laravel production dependencies
        if: steps.deployment_scope.outputs.frontend_only != 'true'
        working-directory: laravel
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Configure SSH
        run: |
          set -eu
          : "${SSH_HOST:?Missing HOSTINGER_SSH_HOST secret}"
          : "${SSH_PORT:?Missing HOSTINGER_SSH_PORT secret}"
          : "${SSH_USERNAME:?Missing HOSTINGER_SSH_USERNAME secret}"
          : "${SSH_PRIVATE_KEY:?Missing HOSTINGER_SSH_PRIVATE_KEY secret}"
          : "${SSH_KNOWN_HOSTS:?Missing HOSTINGER_SSH_KNOWN_HOSTS secret}"
          case "$SSH_HOST" in
            *[!A-Za-z0-9.-]*)
              echo "HOSTINGER_SSH_HOST must contain only a hostname or IP address."
              exit 1
              ;;
          esac
          case "$SSH_PORT" in
            *[!0-9]*)
              echo "HOSTINGER_SSH_PORT must contain digits only."
              exit 1
              ;;
          esac
          install -m 700 -d ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null; then
            echo "HOSTINGER_SSH_PRIVATE_KEY is invalid. Replace it with the complete unencrypted OpenSSH private key file."
            exit 1
          fi

      - name: Verify Hostinger deployment tools
        env:
          FRONTEND_ONLY: ${{ steps.deployment_scope.outputs.frontend_only }}
        run: |
          set -eu
          attempt=1
          max_attempts=8
          while [ "$attempt" -le "$max_attempts" ]; do
            if [ "$FRONTEND_ONLY" = "true" ]; then
              remote_check="command -v rsync"
            else
              remote_check="command -v rsync && command -v composer && command -v php"
            fi
            if ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=1 "$SSH_USERNAME@$SSH_HOST" "$remote_check"; then
              break
            fi
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Unable to verify Hostinger deployment access after $max_attempts SSH attempts."
              exit 1
            fi
            echo "Hostinger SSH check failed (attempt $attempt/$max_attempts); retrying in 15 seconds."
            sleep 15
            attempt=$((attempt + 1))
          done

      - name: Deploy Laravel application
        if: steps.deployment_scope.outputs.frontend_only != 'true'
        run: |
          set -eu
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 "$SSH_USERNAME@$SSH_HOST" \
            "mkdir -p '$REMOTE_ROOT/laravel'"
          rsync -az \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='storage/' \
            --exclude='bootstrap/cache/' \
            --exclude='tests/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='public/uploads/' \
            --exclude='public/storage' \
            -e "ssh -i ~/.ssh/id_ed25519 -p $SSH_PORT -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3" \
            laravel/ \
            "$SSH_USERNAME@$SSH_HOST:$REMOTE_ROOT/laravel/"

      - name: Deploy order status notification handler
        if: steps.deployment_scope.outputs.frontend_only != 'true'
        run: |
          set -eu
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 "$SSH_USERNAME@$SSH_HOST" \
            "mkdir -p '$REMOTE_ROOT/staff'"
          rsync -az \
            -e "ssh -i ~/.ssh/id_ed25519 -p $SSH_PORT -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3" \
            staff/api_update_order_status.php \
            "$SSH_USERNAME@$SSH_HOST:$REMOTE_ROOT/staff/api_update_order_status.php"

      - name: Deploy staff access rules and remove legacy SMS log
        if: steps.deployment_scope.outputs.frontend_only != 'true'
        run: |
          set -eu
          scp -i ~/.ssh/id_ed25519 -P "$SSH_PORT" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 \
            staff/.htaccess \
            "$SSH_USERNAME@$SSH_HOST:$REMOTE_ROOT/staff/.htaccess"
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 "$SSH_USERNAME@$SSH_HOST" \
            "rm -f '$REMOTE_ROOT/staff/sms_log.txt'"

      - name: Deploy custom cake quote handler
        if: steps.deployment_scope.outputs.frontend_only != 'true'
        run: |
          set -eu
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 "$SSH_USERNAME@$SSH_HOST" \
            "mkdir -p '$REMOTE_ROOT/staff'"
          rsync -az \
            -e "ssh -i ~/.ssh/id_ed25519 -p $SSH_PORT -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3" \
            staff/api_orders.php \
            "$SSH_USERNAME@$SSH_HOST:$REMOTE_ROOT/staff/api_orders.php"

      - name: Deploy product stock history handler
        if: steps.deployment_scope.outputs.frontend_only != 'true'
        run: |
          set -eu
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 "$SSH_USERNAME@$SSH_HOST" \
            "mkdir -p '$REMOTE_ROOT/staff'"
          rsync -az \
            -e "ssh -i ~/.ssh/id_ed25519 -p $SSH_PORT -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3" \
            staff/api_product_stock_history.php \
            "$SSH_USERNAME@$SSH_HOST:$REMOTE_ROOT/staff/api_product_stock_history.php"

      - name: Deploy business analytics handler
        if: steps.deployment_scope.outputs.frontend_only != 'true'
        run: |
          set -eu
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 "$SSH_USERNAME@$SSH_HOST" \
            "mkdir -p '$REMOTE_ROOT/staff'"
          rsync -az \
            -e "ssh -i ~/.ssh/id_ed25519 -p $SSH_PORT -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3" \
            staff/api_business_analytics.php \
            "$SSH_USERNAME@$SSH_HOST:$REMOTE_ROOT/staff/api_business_analytics.php"

      - name: Deploy predictive analytics handler
        if: steps.deployment_scope.outputs.frontend_only != 'true'
        run: |
          set -eu
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 "$SSH_USERNAME@$SSH_HOST" \
            "mkdir -p '$REMOTE_ROOT/admin/api'"
          rsync -az \
            -e "ssh -i ~/.ssh/id_ed25519 -p $SSH_PORT -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3" \
            admin/api/api_predictive_analytics.php \
            "$SSH_USERNAME@$SSH_HOST:$REMOTE_ROOT/admin/api/api_predictive_analytics.php"

      - name: Deploy legacy database and authentication helpers
        if: steps.deployment_scope.outputs.frontend_only != 'true'
        run: |
          set -eu
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 "$SSH_USERNAME@$SSH_HOST" \
            "mkdir -p '$REMOTE_ROOT/includes'"
          rsync -az \
            -e "ssh -i ~/.ssh/id_ed25519 -p $SSH_PORT -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3" \
            includes/api_auth.php includes/db.php includes/inventory.php includes/session_security.php includes/predictive_forecasting.php includes/paymongo_order_refund.php \
            "$SSH_USERNAME@$SSH_HOST:$REMOTE_ROOT/includes/"

      - name: Deploy waste logging handler
        if: steps.deployment_scope.outputs.frontend_only != 'true'
        run: |
          set -eu
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 "$SSH_USERNAME@$SSH_HOST" \
            "mkdir -p '$REMOTE_ROOT/staff'"
          rsync -az \
            -e "ssh -i ~/.ssh/id_ed25519 -p $SSH_PORT -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3" \
            staff/api_waste_log.php \
            "$SSH_USERNAME@$SSH_HOST:$REMOTE_ROOT/staff/api_waste_log.php"

      - name: Deploy customer order handlers
        if: steps.deployment_scope.outputs.frontend_only != 'true'
        run: |
          set -eu
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 "$SSH_USERNAME@$SSH_HOST" \
            "mkdir -p '$REMOTE_ROOT/customer'"
          rsync -az \
            -e "ssh -i ~/.ssh/id_ed25519 -p $SSH_PORT -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3" \
            customer/api_register.php customer/api_place_order.php customer/api_cancel_order.php customer/paymongo_webhook.php \
            "$SSH_USERNAME@$SSH_HOST:$REMOTE_ROOT/customer/"

      - name: Deploy React production build
        run: |
          set -eu
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 "$SSH_USERNAME@$SSH_HOST" \
            "mkdir -p '$REMOTE_ROOT/customer_portal/build'"
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -p $SSH_PORT -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3" \
            customer_portal/build/ \
            "$SSH_USERNAME@$SSH_HOST:$REMOTE_ROOT/customer_portal/build/"
          rsync -az \
            -e "ssh -i ~/.ssh/id_ed25519 -p $SSH_PORT -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3" \
            customer_portal/build/qr-ph-logo.svg \
            "$SSH_USERNAME@$SSH_HOST:$REMOTE_ROOT/qr-ph-logo.svg"

      - name: Deploy About Us image
        if: steps.deployment_scope.outputs.frontend_only != 'true'
        run: |
          set -eu
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 "$SSH_USERNAME@$SSH_HOST" \
            "mkdir -p '$REMOTE_ROOT/uploads'"
          rsync -az \
            -e "ssh -i ~/.ssh/id_ed25519 -p $SSH_PORT -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3" \
            "uploads/about us.jpg" \
            "$SSH_USERNAME@$SSH_HOST:$REMOTE_ROOT/uploads/"

      - name: Deploy login cake image
        if: steps.deployment_scope.outputs.frontend_only != 'true'
        run: |
          set -eu
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 "$SSH_USERNAME@$SSH_HOST" \
            "mkdir -p '$REMOTE_ROOT/uploads'"
          rsync -az \
            -e "ssh -i ~/.ssh/id_ed25519 -p $SSH_PORT -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3" \
            uploads/login_cake.png \
            "$SSH_USERNAME@$SSH_HOST:$REMOTE_ROOT/uploads/"

      - name: Deploy root rewrite rules
        if: steps.deployment_scope.outputs.frontend_only != 'true'
        run: |
          set -eu
          scp -i ~/.ssh/id_ed25519 -P "$SSH_PORT" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 \
            .htaccess \
            "$SSH_USERNAME@$SSH_HOST:$REMOTE_ROOT/.htaccess"

      - name: Apply application migrations and refresh config cache
        if: steps.deployment_scope.outputs.frontend_only != 'true'
        run: |
          set -eu
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 "$SSH_USERNAME@$SSH_HOST" \
            "cd '$REMOTE_ROOT/laravel' && php artisan migrate --path=database/migrations/2026_10_03_000002_add_product_size_to_product_recipes.php --force && php artisan migrate --path=database/migrations/2026_10_03_000003_make_product_recipe_uniqueness_size_aware.php --force && php artisan migrate --path=database/migrations/2026_09_30_000001_add_revenue_to_analytics_sales_history.php --force && php artisan migrate --path=database/migrations/2026_10_07_000001_add_sales_type_to_analytics_imports.php --force && php artisan migrate --path=database/migrations/2026_10_16_000001_add_stored_path_to_analytics_imports.php --force && php artisan migrate --path=database/migrations/2026_10_16_000002_add_queue_job_id_to_analytics_imports.php --force && php artisan migrate --path=database/migrations/2026_10_16_000003_add_import_foreign_key_to_sales_history.php --force && php artisan migrate --path=database/migrations/2026_10_06_000006_add_size_to_product_inventory_movements.php --force && php artisan migrate --path=database/migrations/2026_10_10_000001_add_username_and_profile_picture_to_users.php --force && php artisan migrate --path=database/migrations/2026_10_10_000002_set_confirmed_cake_stock_by_size.php --force && php artisan migrate --path=database/migrations/2026_10_07_000002_create_customized_cake_order_tables.php --force && php artisan migrate --path=database/migrations/2026_10_11_000001_add_promotion_coupon_discounts.php --force && php artisan migrate --path=database/migrations/2026_10_12_000001_add_size_to_analytics_sales_history.php --force && php artisan migrate --path=database/migrations/2026_10_13_000001_create_customer_two_factor_tables.php --force && php artisan migrate --path=database/migrations/2026_10_13_000002_add_delivery_methods_to_customer_two_factor.php --force && php artisan migrate --path=database/migrations/2026_10_21_000001_create_order_feedback_table.php --force && php artisan db:seed --class='Database\\Seeders\\CakeOrderRecipesSeeder' --force && php artisan migrate --path=database/migrations/2026_10_17_000001_correct_blueberry_cheesecake_cream_cheese_quantity.php --force && php artisan migrate --path=database/migrations/2026_10_17_000002_create_custom_cake_request_settings_table.php --force && php artisan migrate --path=database/migrations/2026_10_20_000001_create_shop_settings_tables.php --force && php artisan migrate --path=database/migrations/2026_10_20_000002_add_predictive_import_options.php --force && php artisan package:discover --ansi && php artisan config:cache"
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=3 "$SSH_USERNAME@$SSH_HOST" \
            "cd '$REMOTE_ROOT/laravel' && php artisan migrate --path=database/migrations/2026_10_21_000003_create_order_return_refund_requests_table.php --force && php artisan migrate --path=database/migrations/2026_10_21_000004_add_return_refund_order_status.php --force && php artisan migrate --path=database/migrations/2026_10_21_000005_add_admin_reason_to_order_return_refund_requests.php --force && php artisan migrate --path=database/migrations/2026_10_23_000001_add_ready_for_pickup_timestamp_to_orders.php --force && php artisan migrate --path=database/migrations/2026_10_26_000002_add_rider_details_to_orders.php --force && php artisan migrate --path=database/migrations/2026_10_27_000002_add_cancelled_at_to_orders.php --force && php artisan migrate --path=database/migrations/2026_10_27_000003_add_customer_payment_reference_to_orders.php --force"

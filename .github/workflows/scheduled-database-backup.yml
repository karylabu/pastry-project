name: Run scheduled database backup

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
      SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
      SSH_USERNAME: ${{ secrets.HOSTINGER_SSH_USERNAME }}
      SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
      REMOTE_ROOT: domains/pastryproject.shop/public_html

    steps:
      - name: Configure SSH
        run: |
          set -eu
          : "${SSH_HOST:?Missing HOSTINGER_SSH_HOST secret}"
          : "${SSH_PORT:?Missing HOSTINGER_SSH_PORT secret}"
          : "${SSH_USERNAME:?Missing HOSTINGER_SSH_USERNAME secret}"
          : "${SSH_PRIVATE_KEY:?Missing HOSTINGER_SSH_PRIVATE_KEY secret}"
          : "${SSH_KNOWN_HOSTS:?Missing HOSTINGER_SSH_KNOWN_HOSTS secret}"
          install -m 700 -d ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null

      - name: Run due daily backup
        run: |
          set -eu
          ssh -T -i ~/.ssh/id_ed25519 -p "$SSH_PORT" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -o ConnectionAttempts=3 \
            "$SSH_USERNAME@$SSH_HOST" \
            "cd '$REMOTE_ROOT/laravel' && php artisan backups:scheduled --no-interaction"